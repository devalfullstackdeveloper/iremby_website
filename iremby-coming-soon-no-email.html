<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b20">
  <meta name="description" content="A fresh idea. A new beginning. Iremby is coming soon.">
  <title>Iremby — Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #080d1d;
      --white: #f6edff;
      --muted: #a6a1c9;
      --pink: #f15cff;
      --violet: #a34dff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 5vw, 64px);
      overflow-x: hidden;
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(137, 37, 198, .48) 0%, rgba(83, 27, 130, .23) 34%, transparent 67%),
        linear-gradient(135deg, #21172f, #100b20 58%, #241333);
    }
    .stage {
      position: relative;
      isolation: isolate;
      width: min(100%, 1210px);
      min-height: min(740px, calc(100svh - 56px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(42px, 7vh, 82px) 24px 58px;
      overflow: hidden;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(90, 25, 137, .18), transparent 48%),
        #070d1c;
      box-shadow: 0 30px 100px rgba(0,0,0,.3);
    }
    .stage::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: auto -10% -26% -10%;
      height: 42%;
      background: radial-gradient(ellipse, rgba(149, 42, 235, .38), transparent 68%);
      filter: blur(22px);
    }
    .coming {
      margin: 0;
      color: #f0e7ff;
      font-size: clamp(18px, 3vw, 34px);
      font-weight: 400;
      letter-spacing: .42em;
      padding-left: .42em;
      text-shadow: 0 0 24px rgba(206, 157, 255, .35);
    }
    .headline {
      margin: 22px 0 0;
      font-size: clamp(27px, 4.2vw, 48px);
      line-height: 1.12;
      letter-spacing: -.045em;
      font-weight: 650;
      color: #fff;
      text-shadow: 0 0 30px rgba(202, 91, 255, .24);
    }
    .headline span {
      color: #e7caff;
      background: linear-gradient(90deg, #fff0ff, #d6a5ff 55%, #ff9bea);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .orb-wrap {
      position: relative;
      width: clamp(150px, 20vw, 238px);
      aspect-ratio: 1;
      margin: clamp(28px, 5vh, 48px) 0 42px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 28px rgba(229, 48, 255, .55));
    }
    .orb-glow {
      position: absolute;
      width: 145%;
      height: 145%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(234, 44, 255, .36), rgba(161, 34, 221, .13) 42%, transparent 70%);
      filter: blur(18px);
      animation: glow 4s ease-in-out infinite alternate;
    }
    .orb {
      position: relative;
      width: 92%;
      height: 92%;
      overflow: hidden;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 45% 24%, rgba(255,255,255,.92), rgba(244,176,255,.95) 18%, rgba(194,75,244,.9) 43%, rgba(78,26,154,.98) 69%, #100d35 78%);
      box-shadow:
        inset 0 9px 22px rgba(255,255,255,.8),
        inset 0 -28px 38px rgba(9,5,44,.85),
        0 0 18px rgba(255,100,255,.75),
        0 0 70px rgba(206,39,255,.8);
    }
    .orb::before {
      content: "";
      position: absolute;
      inset: 16% 10% 11%;
      background: linear-gradient(145deg, rgba(255,255,255,.58), rgba(190,150,255,.12) 44%, rgba(42,10,111,.75));
      clip-path: polygon(48% 0, 82% 12%, 100% 45%, 84% 82%, 50% 100%, 14% 83%, 0 45%, 18% 13%);
      opacity: .8;
    }
    .orb::after {
      content: "";
      position: absolute;
      inset: 17% 12% 12%;
      background:
        linear-gradient(32deg, transparent 49.5%, rgba(255,255,255,.17) 50%, transparent 50.8%),
        linear-gradient(145deg, transparent 49.5%, rgba(255,255,255,.16) 50%, transparent 50.8%),
        linear-gradient(85deg, transparent 49.5%, rgba(255,255,255,.13) 50%, transparent 50.8%),
        linear-gradient(0deg, transparent 49.5%, rgba(255,255,255,.12) 50%, transparent 50.8%);
      clip-path: polygon(48% 0, 82% 12%, 100% 45%, 84% 82%, 50% 100%, 14% 83%, 0 45%, 18% 13%);
    }
    @keyframes glow {
      from { transform: scale(.94); opacity: .72; }
      to { transform: scale(1.08); opacity: 1; }
    }
    @media (max-width: 560px) {
      body { padding: 12px; }
      .stage {
        min-height: calc(100svh - 24px);
        padding: 52px 22px 38px;
      }
      .coming { letter-spacing: .28em; padding-left: .28em; }
      .headline { max-width: 340px; }
      .orb-wrap { margin: 34px 0 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <p class="coming">COMING SOON</p>
    <h1 class="headline">A Fresh Idea.<br><span>A New Beginning.</span></h1>

    <div class="orb-wrap" aria-hidden="true">
      <div class="orb-glow"></div>
      <div class="orb"></div>
    </div>


  </main>
</body>
</html>
